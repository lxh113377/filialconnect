name: Refresh offline scam-domain list

# The offline list is a snapshot, so freshness has to be scheduled rather than
# remembered. A pull request (not a direct push) keeps the 83k-line diff reviewable.
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fetch upstream rootlist (destroylist, MIT)
        run: python tools/fetch-fraud-feeds.py

      - name: Report coverage counters
        run: cat assets/data/fraud-feeds-meta.json

      - name: Open pull request when the snapshot changed
        run: |
          if git diff --quiet -- assets/data/destroylist-domains.txt; then
            echo "no upstream change; nothing to open"
            exit 0
          fi
          BR="automate/scam-list-$(date -u +%Y%m%d)"
          git checkout -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git commit -m "chore(data): refresh offline scam-domain snapshot"
          git push origin "$BR"
          gh pr create --fill --base main --head "$BR" \
            --title "chore(data): refresh offline scam-domain snapshot" \
            --body "Scheduled refresh from destroylist (MIT). See assets/data/fraud-feeds-meta.json for the upstream commit and domain counters."
        env:
          GH_TOKEN: ${{ github.token }}
