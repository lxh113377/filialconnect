name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # linkinator 8 pulls undici 8, which needs >= 22.19; node 20 dies at
          # import time with `webidl.util.markAsUncloneable is not a function`.
          node-version: 22
          cache: npm

      - name: Install pinned dev tooling (site itself needs none of this)
        run: npm ci

      - name: HTML validation (HTMLHint)
        run: node_modules/.bin/htmlhint "index.html" "404.html" "pages/*.html"

      - name: i18n symmetry check (EN/ZH keys + HTML coverage + orphans)
        run: python3 tools/check-i18n.py

      - name: Content pipeline drift check (build.py)
        run: python3 tools/build.py check

      - name: Node-owned artifacts drift check (locales/sitemap/lighthouserc/workbox sw)
        run: node tools/build.mjs check

      - name: Pipeline self-tests (build/check/i18n invariants)
        run: python3 tools/test_build.py

      - name: Scam-list provenance and freshness check
        run: python3 tools/fetch-fraud-feeds.py --check

      - name: Link check (linkinator, fragments + external)
        run: |
          node_modules/.bin/linkinator . \
            --recurse --check-fragments --check-external \
            --skip "https://lxh113377.github.io/filialconnect.*"

      - name: Link check (markdown docs)
        run: node_modules/.bin/linkinator README.md CONTRIBUTING.md SECURITY.md SOURCES.md --recurse

      - name: Serve site under the production subpath
        run: |
          mkdir -p /tmp/pages-root/filialconnect
          cp -r index.html 404.html pages assets sitemap.xml robots.txt content \
                /tmp/pages-root/filialconnect/
          (cd /tmp/pages-root && python3 -m http.server 8765 >/tmp/http.log 2>&1 &)
          for i in $(seq 1 20); do
            curl -sf "http://127.0.0.1:8765/filialconnect/index.html" >/dev/null && break
            sleep 1
          done

      - name: Offline scam-domain asset is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8765/filialconnect/assets/data/destroylist-domains.txt")
          echo "destroylist-domains.txt -> $code"
          test "$code" = "200"

      - name: Lighthouse CI (performance + a11y budgets, all pages, desktop)
        run: node_modules/.bin/lhci autorun --config=lighthouserc.json

      - name: Lighthouse CI (mobile budgets - primary device for seniors)
        run: node_modules/.bin/lhci autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
