name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Stage site (public deliverable only)
        run: |
          mkdir _site
          cp -r index.html 404.html pages assets sitemap.xml robots.txt _site/
          cp README.md LICENSE SECURITY.md SOURCES.md CONTRIBUTING.md _site/
          find _site -name '__pycache__' -type d -prune -exec rm -rf {} +
          find _site -name '*.pyc' -delete
          echo "staged $(du -sh _site | cut -f1), $(find _site -type f | wc -l) files"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
